$schema: https://json-schema.org/draft/2020-12/schema
$id: https://raw.githubusercontent.com/api-commons/compliance/main/compliance-json-schema.yml
title: API Commons Compliance
description: >-
  The machine-readable compliance attestations an API provider states — SOC 2, ISO 27001, PCI
  DSS, HIPAA, FedRAMP and the rest — with the scope, audit period, issuer and how the report can
  be obtained. Every attestation carries the verbatim sentence from the provider's own trust or
  compliance page. APIs.io records what is claimed, and does not verify it.
oneOf:
- title: Compliance document
  description: A standalone document, as written to all/<slug>/compliance/.
  type: object
  $ref: '#/$defs/document'
- title: Attestations properties
  description: One or more apis.yml property envelopes carrying the document under `data`.
  type: array
  minItems: 1
  items:
    $ref: '#/$defs/property'
$defs:
  verbatim:
    type:
    - string
    - 'null'
    minLength: 1
    description: Copied word for word from the page at `url`. The harvester checks every row against
      the fetched page text and drops any row that does not match. Never paraphrased, never synthetic.
  period:
    type:
    - string
    - 'null'
    description: A period copied exactly as written on the page (for example "30 days" or "12
      months"). Never normalized or computed.
  stance:
    type: string
    enum:
    - allowed
    - prohibited
    - conditional
    - unstated
    description: Whether the page permits something. `allowed`, `prohibited` and `conditional`
      each need a verbatim `text`. `unstated` means the page says nothing about it, which is a
      valid result and is never guessed.
  stanceText:
    type: object
    additionalProperties: false
    required:
    - stance
    description: A permission and the verbatim sentence it was read from.
    properties:
      stance:
        $ref: '#/$defs/stance'
      text:
        $ref: '#/$defs/verbatim'
    if:
      properties:
        stance:
          not:
            const: unstated
    then:
      required:
      - text
      properties:
        text:
          type: string
          minLength: 1
  textOnly:
    type: object
    additionalProperties: false
    required:
    - text
    description: A clause that is recorded only as the verbatim text it was read from.
    properties:
      text:
        $ref: '#/$defs/verbatim'
  periodText:
    type: object
    additionalProperties: false
    required:
    - period
    - text
    description: A period and the verbatim sentence that states it.
    properties:
      period:
        $ref: '#/$defs/period'
      text:
        $ref: '#/$defs/verbatim'
  summaryText:
    type: object
    additionalProperties: false
    required:
    - summary
    - text
    description: A short label for a clause plus the verbatim clause itself.
    properties:
      summary:
        type: string
        description: A short label for the clause. The label is ours; the `text` is the provider's.
        minLength: 1
      text:
        type: string
        minLength: 1
        description: Copied word for word from the page at `url`. The harvester checks every row
          against the fetched page text and drops any row that does not match. Never paraphrased,
          never synthetic.
  derivation:
    type: object
    additionalProperties: true
    required:
    - synthetic
    - method
    - read
    - tool
    description: How this document was produced. Every business-layer document is harvested from
      the provider's own page; none is generated.
    properties:
      synthetic:
        const: false
        description: Always false. Synthetic or template-filled documents are not published (roadmap#1086).
      method:
        const: harvested
        description: 'Always `harvested`: the page was fetched by code and the model only transcribed
          rows from it.'
      read:
        type: string
        description: The date the page was read (YYYY-MM-DD).
        format: date
      tool:
        type: string
        description: The harvester that produced the document, e.g. engine/business/harvest-business.py.
      model:
        type: string
        description: The model id that transcribed the rows. The model never authors text; it
          only selects it.
  document:
    type: object
    additionalProperties: false
    required:
    - compliance
    - provider
    - aid
    - url
    - source_date
    - x-apis-io-derivation
    description: A Compliance document as harvested from one provider page.
    properties:
      compliance:
        type: string
        description: 'Schema version of this document. `compliance: 0.1.0` for this release.'
        pattern: ^\d+\.\d+\.\d+$
      provider:
        type: string
        description: The provider's name as it appears in its apis.yml.
        minLength: 1
      aid:
        type: string
        description: The provider's APIs.io slug (the `all/<slug>` directory and page slug).
        pattern: ^[a-z0-9][a-z0-9-]*$
      url:
        type: string
        description: The page this document was read from.
        format: uri
      source_date:
        type: string
        description: When the page was read (YYYY-MM-DD).
        format: date
      x-apis-io-derivation:
        $ref: '#/$defs/derivation'
      trust_center:
        type:
        - object
        - 'null'
        additionalProperties: false
        description: The provider's trust center.
        properties:
          url:
            type:
            - string
            - 'null'
            format: uri
            description: The trust center URL.
      attestations:
        type: array
        description: Attestations the page states.
        items:
          type: object
          additionalProperties: false
          required:
          - framework
          - text
          properties:
            framework:
              type: string
              enum:
              - SOC1
              - SOC2
              - SOC3
              - ISO27001
              - ISO27017
              - ISO27018
              - ISO27701
              - ISO42001
              - ISO9001
              - PCI-DSS
              - HIPAA
              - HITRUST
              - FedRAMP
              - StateRAMP
              - GDPR
              - CCPA
              - CSA-STAR
              - TISAX
              - C5
              - IRAP
              - CyberEssentials
              - NIST-800-53
              - NIST-CSF
              - DORA
              - other
              description: The framework attested to.
            type:
              type:
              - string
              - 'null'
              description: The attestation type as written (e.g. "Type II", "certified", "compliant").
            scope:
              type:
              - string
              - 'null'
              description: What the attestation covers, as written.
            period:
              $ref: '#/$defs/period'
            issuer:
              type:
              - string
              - 'null'
              description: The auditor or certifying body, as named.
            report_access:
              type: string
              enum:
              - public
              - nda
              - on_request
              - unstated
              description: How the report can be obtained.
            text:
              type: string
              minLength: 1
              description: Copied word for word from the page at `url`. The harvester checks every
                row against the fetched page text and drops any row that does not match. Never
                paraphrased, never synthetic.
    patternProperties:
      ^x-:
        description: Extensions.
  property:
    type: object
    additionalProperties: false
    required:
    - type
    - url
    - data
    description: The Attestations property as it appears inside an apis.yml / apis.json index.
    properties:
      name:
        type: string
        description: The name of the property as it appears in the index.
      type:
        const: Attestations
        description: The API Commons property type. Always Attestations.
      description:
        type: string
        description: What this property covers.
      url:
        type: string
        description: The artifact path (or provider page) this property points at.
        format: uri-reference
      source_date:
        type: string
        description: The date the data was last verified against the provider page.
        format: date
      data:
        $ref: '#/$defs/document'
